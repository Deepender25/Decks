# Netlify Configuration for Slide Decks
[build]
  publish = "."
  edge_functions = "netlify/edge-functions"

# Edge Function Authentication Routing
[[edge_functions]]
  path = "/"
  function = "auth"

[[edge_functions]]
  path = "/index.html"
  function = "auth"

[[edge_functions]]
  path = "/api/*"
  function = "auth"

# Clean URL and Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Asset Caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
